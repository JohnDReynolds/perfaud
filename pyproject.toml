[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "perfaud"
version = "0.1.0"
description = "Local-first audit software for changes in reported portfolio performance."
authors = [{ name = "John Reynolds", email = "jjjkreynolds@gmail.com" }]
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
keywords = [
    "portfolio",
    "performance",
    "audit",
    "reconciliation",
    "restatement",
    "data quality",
    "portfolio accounting",
    "Axys",
    "APX",
]
requires-python = ">=3.11.9"
dependencies = [
    "polars>=1.24.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "lxml>=5.1.0",
    "mypy>=1.10",
    "pandas>=2.2",
    "pandas-stubs",
    "pillow>=10.0",
    "pytest>=8.0",
    "pylint>=4.0",
    "pyright>=1.1.409",
    "setuptools>=77.0.0",
    "twine>=6.0",
    "types-PyYAML",
]

[project.scripts]
perfaud = "perfaud.cli:main"

[project.urls]
Repository = "https://github.com/JohnDReynolds/perfaud"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
perfaud = [
    "py.typed",
    "templates/axys_apx/*.md",
    "templates/axys_apx/*.yaml",
    "templates/axys_apx/input/snapshot_a/*.csv",
    "templates/axys_apx/input/snapshot_b/*.csv",
]

[tool.mypy]
python_version = "3.11"
files = ["src/perfaud", "scripts"]
strict = true
show_error_codes = true
warn_unused_configs = true

[tool.pyright]
include = ["src/perfaud", "tests"]
extraPaths = ["src"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pylint.main]
persistent = false
py-version = "3.11"

[tool.pylint.format]
max-line-length = 99

[tool.pylint."messages control"]
enable = [
    "duplicate-code",
    "too-many-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "unused-argument",
    "redefined-outer-name",
    "broad-exception-caught",
]

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8
max-branches = 40
max-locals = 30
max-attributes = 12
min-public-methods = 0
